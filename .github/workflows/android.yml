name: StallPOS CI and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry; leave empty for a gate-only run
        required: false
        default: ''
        type: string
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Unit, lint, and debug build
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:compileDebugAndroidTestKotlin

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: API 35 instrumented tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Worker unit and integration gates
        working-directory: worker
        run: |
          npm ci
          npm run check
          npm run restore-drill

      - name: Apply both D1 migration sets locally
        working-directory: worker
        run: |
          npx wrangler d1 migrations apply stallpos-pos --local --persist-to "$RUNNER_TEMP/d1-pos"
          npx wrangler d1 migrations apply stallpos-deletion --local --persist-to "$RUNNER_TEMP/d1-deletion"
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4

      - name: Dashboard browser smoke
        working-directory: worker
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          npx wrangler dev --local --port 8787 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8787/dashboard > /dev/null
          "$CHROME_PATH" --headless --no-sandbox --disable-gpu --window-size=390,844 \
            --virtual-time-budget=3000 --dump-dom http://127.0.0.1:8787/dashboard > "$RUNNER_TEMP/dashboard.html"
          grep -F '<title>StallPOS 活動分析</title>' "$RUNNER_TEMP/dashboard.html"
          grep -F '查看你的市集成果' "$RUNNER_TEMP/dashboard.html"

  signed-upgrade:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Build production-signed candidate
        env:
          KEYSTORE_BASE64: ${{ secrets.STALLPOS_RELEASE_KEYSTORE_BASE64 }}
          STALLPOS_RELEASE_STORE_PASSWORD: ${{ secrets.STALLPOS_RELEASE_STORE_PASSWORD }}
          STALLPOS_RELEASE_KEY_ALIAS: ${{ secrets.STALLPOS_RELEASE_KEY_ALIAS }}
          STALLPOS_RELEASE_KEY_PASSWORD: ${{ secrets.STALLPOS_RELEASE_KEY_PASSWORD }}
          STALLPOS_RELEASE_STORE_FILE: ${{ runner.temp }}/stallpos-release.jks
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$STALLPOS_RELEASE_STORE_FILE"
          chmod 600 "$STALLPOS_RELEASE_STORE_FILE"
          ./gradlew :app:assembleRelease

      - name: Download v1.5 production baseline and compare certificates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.5.0 --pattern StallPOS-1.5.0.apk --dir "$RUNNER_TEMP"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          old_cert="$($apksigner verify --print-certs "$RUNNER_TEMP/StallPOS-1.5.0.apk" | awk -F': ' '/certificate SHA-256 digest/ {print $NF; exit}')"
          new_cert="$($apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | awk -F': ' '/certificate SHA-256 digest/ {print $NF; exit}')"
          test -n "$old_cert"
          test "$old_cert" = "$new_cert"

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Production-signed v1.5 to candidate upgrade
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/StallPOS-1.5.0.apk"
            adb shell am start -W -n com.lambliver.stallpos/.ui.MainActivity
            adb shell am force-stop com.lambliver.stallpos
            adb logcat -c
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.lambliver.stallpos/.ui.MainActivity
            adb shell pidof com.lambliver.stallpos
            if adb logcat -d | grep -F 'FATAL EXCEPTION' | grep -F 'com.lambliver.stallpos'; then exit 1; fi

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [verify, worker, signed-upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Validate tag and release state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          test "$TAG" = "v$version"
          git fetch origin main --no-tags
          tag_commit="$(git rev-list -n 1 "$TAG")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
          grep -F "## [$version]" docs/CHANGELOG.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release or draft already exists for $TAG" >&2
            exit 1
          fi

      - name: Decode keystore and build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.STALLPOS_RELEASE_KEYSTORE_BASE64 }}
          STALLPOS_RELEASE_STORE_PASSWORD: ${{ secrets.STALLPOS_RELEASE_STORE_PASSWORD }}
          STALLPOS_RELEASE_KEY_ALIAS: ${{ secrets.STALLPOS_RELEASE_KEY_ALIAS }}
          STALLPOS_RELEASE_KEY_PASSWORD: ${{ secrets.STALLPOS_RELEASE_KEY_PASSWORD }}
          STALLPOS_RELEASE_STORE_FILE: ${{ runner.temp }}/stallpos-release.jks
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STALLPOS_RELEASE_STORE_PASSWORD"
          test -n "$STALLPOS_RELEASE_KEY_ALIAS"
          test -n "$STALLPOS_RELEASE_KEY_PASSWORD"
          trap 'rm -f -- "$STALLPOS_RELEASE_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$STALLPOS_RELEASE_STORE_FILE"
          chmod 600 "$STALLPOS_RELEASE_STORE_FILE"
          test -s "$STALLPOS_RELEASE_STORE_FILE"
          ./gradlew :app:assembleRelease

      - name: Verify certificate and checksum final asset
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          mkdir -p dist
          apk_name="StallPOS-$version.apk"
          mv app/build/outputs/apk/release/app-release.apk "dist/$apk_name"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          verify_output="$($apksigner verify --verbose --print-certs "dist/$apk_name")"
          printf '%s\n' "$verify_output"
          actual="$(printf '%s\n' "$verify_output" | awk -F': ' \
            '/certificate SHA-256 digest/ {print toupper($NF); exit}' | tr -d ':[:space:]')"
          expected="$(tr -d ':[:space:]' < RELEASE_CERT_SHA256 | tr '[:lower:]' '[:upper:]')"
          printf '%s\n' "$actual" | grep -Eq '^[0-9A-F]{64}$'
          printf '%s\n' "$expected" | grep -Eq '^[0-9A-F]{64}$'
          test "$actual" = "$expected"
          (cd dist && sha256sum "$apk_name" > "$apk_name.sha256")
          (cd dist && sha256sum --check "$apk_name.sha256")

      - name: Create verified draft and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          apk_name="StallPOS-$version.apk"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { printing=1 }
            printing && $0 ~ /^## \[/ && $0 !~ "^## \\[" version "\\]" { exit }
            printing { print }
          ' docs/CHANGELOG.md > "$notes"
          printf '\n## 安裝前注意\n\n既有 debug／未知簽章安裝無法直接覆蓋；請先將 StallPOS JSON 備份存到 App sandbox 外，再移除舊版、安裝此 APK 並還原。\n\nAPK signing certificate SHA-256：%s\n' \
            "$(tr -d '\r\n' < RELEASE_CERT_SHA256)" >> "$notes"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "StallPOS $TAG" \
            --notes-file "$notes" \
            "dist/$apk_name" \
            "dist/$apk_name.sha256"

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          test -n "$release_id"
          mkdir -p "$RUNNER_TEMP/release-assets"
          for asset in "$apk_name" "$apk_name.sha256"; do
            asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq ".[] | select(.name == \"$asset\") | .id")"
            test -n "$asset_id"
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/release-assets/$asset"
            cmp "dist/$asset" "$RUNNER_TEMP/release-assets/$asset"
          done

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.immutable')"
          test "$immutable" = "true"
